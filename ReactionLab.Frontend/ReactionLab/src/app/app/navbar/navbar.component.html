              <g id="liquid-stream-curved" class="stream-hidden">

                <g id="flask-glass">

                  <line id="flask-rim" class="flask-rim" x1="132.3" y1="78.85" x2="162.31" y2="78.85"/>

        <!-- Auth Buttons: desktop only -->
        @if (showAuthButtons) {
          <div class="auth-btn-container d-none d-md-flex align-items-center gap-3 flex-shrink-0">
            @if (isLearningPage) {
              <a routerLink="/user" id="loginBtn">My profile</a>
              <a routerLink="/topics" id="signUpBtn">My learning</a>
            } @else {
              <a routerLink="/login" id="loginBtn">Log in</a>
              <a routerLink="/signup" id="signUpBtn">Sign up</a>
            }
          </div>
        }

        <!-- Hamburger: mobile only -->
        @if (showAuthButtons) {
          <button
            class="hamburger-btn d-flex d-md-none flex-shrink-0"
            [class.open]="menuOpen"
            (click)="toggleMenu()"
            aria-label="Toggle menu"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>
        }

      </div>

      <!-- Mobile dropdown menu -->
      @if (showAuthButtons && menuOpen) {
        <div class="mobile-menu d-md-none">
          @if (isLearningPage) {
            <a routerLink="/user" id="loginBtnMobile" (click)="toggleMenu()">My profile</a>
            <a routerLink="/topics" id="signUpBtnMobile" (click)="toggleMenu()">My learning</a>
          } @else {
            <a routerLink="/login" id="loginBtnMobile" (click)="toggleMenu()">Log in</a>
            <a routerLink="/signup" id="signUpBtnMobile" (click)="toggleMenu()">Sign up</a>
          }
        </div>
      }
