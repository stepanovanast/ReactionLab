<app-navbar></app-navbar>
    <div class="container">
        <div class="content">
            <!-- Profile Header -->
            <div class="profile-header">
                <div class="profile-avatar">
                    <span class="avatar-emoji">{{ avatarEmoji }}</span>
                </div>
                <h1 class="profile-name">{{ userName }}</h1>
            </div>

            <!-- Badges Section -->
            <div class="badges-section">
                <h2 class="badges-title">Badges</h2>
                <div class="badges-grid">
                    @for (badge of badges; track badge.id) {
                        <div class="badge" [class.earned]="badge.earned" [title]="badge.description">
                            <svg class="badge-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
                                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
                                <path d="M4 22h16"/>
                                <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
                                <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
                                <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
                            </svg>
                            <p class="badge-label">{{ badge.name }}</p>
                        </div>
                    }
                </div>
            </div>
        </div>

        <button (click)="signOut()" style="margin:2rem;padding:0.5rem 1rem;background:red;color:white;border:none;cursor:pointer;font-size:1rem;">SIGN OUT</button>
    </div>
