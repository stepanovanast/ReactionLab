<div class="sidebar" id="sidebar" [class.collapsed]="isCollapsed">
    <!-- Menu Items -->
    <div class="menu-items">
        <a routerLink="/topics" class="menu-item" id="topics-item">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
                <path d="M8 7h6"/>
                <path d="M8 11h8"/>
            </svg>
            <span class="menu-text">Topics</span>
        </a>

        <a routerLink="/user" class="menu-item" id="info-item">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/>
                <path d="M20 21a8 8 0 0 0-16 0"/>
            </svg>
            <span class="menu-text">Me</span>
        </a>

        <div class="menu-item" id="expand-toggle" (click)="toggleCollapse()">
            <svg class="icon chevron-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18l6-6-6-6"/>
            </svg>
            <span class="menu-text">Back</span>
        </div>
    </div>

    <!-- Sign Out at the bottom -->
    <div class="menu-item" id="signout-item" (click)="signOut()">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span class="menu-text">Sign Out</span>
    </div>
</div>
