    <div class="main-canvas">
        <!-- Grid background -->
        <div class="grid-background"></div>

        <!-- Macro View Observable - Centered Container -->
        <div class="canvas-center">
            <div class="visualization-container">

                <!-- Top Indicators Row -->
                <div class="indicators-row">

                    <!-- Visualization Title - Hidden on small screens -->
                    <div class="indicator visualization-title">
                        <div class="indicator-value">{{ step?.title }}</div>
                    </div>

                    <div class="indicators-right">
                        <div class="indicator">
                            <div class="indicator-label">Current State</div>
                            <div class="indicator-value">{{ currentStepIndex + 1 }} / {{ reaction?.steps?.length }}</div>
                        </div>
                        <div class="indicator">
                            <div class="indicator-label">Temperature</div>
                            <div class="indicator-value">{{ displayedTemperature }}°C</div>
                        </div>
                        <div class="view-mode-toggle">
                            <button class="mode-btn" [class.active]="viewMode === 'ball-stick'" (click)="setViewMode('ball-stick')" title="Ball & Stick">
                                <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <line x1="6.0" y1="8.0" x2="4.7" y2="6.9" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
                                    <line x1="10.0" y1="8.0" x2="11.3" y2="6.9" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
                                    <circle cx="8" cy="9.5" r="2.5" stroke="currentColor" stroke-width="1"/>
                                    <circle cx="3.5" cy="6" r="1.5" stroke="currentColor" stroke-width="1"/>
                                    <circle cx="12.5" cy="6" r="1.5" stroke="currentColor" stroke-width="1"/>
                                </svg>
                            </button>
                            <button class="mode-btn" [class.active]="viewMode === 'space-fill'" (click)="setViewMode('space-fill')" title="Space Fill">
                                <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M 4.54 8.46 A 2.5 2.5 0 1 1 7.46 5.54 A 3.5 3.5 0 0 1 8.54 5.54 A 2.5 2.5 0 1 1 11.46 8.46 A 3.5 3.5 0 1 1 4.54 8.46 Z" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Main Visualization Box -->
                <div class="visualization-box">
                    <div class="visualization-content">
                        <canvas #threeCanvas class="three-canvas"></canvas>
                    </div>
                </div>

                <!-- Playback Bar — absolutely below the viewport -->
                <div class="playback-bar" (click)="togglePlay()">
                    <div class="play-button" [class.active]="playing">
                        <svg class="playback-icon" viewBox="0 0 24 24" fill="currentColor">
                            @if (playing) {
                                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                            } @else {
                                <path d="M8 5v14l11-7z"/>
                            }
                        </svg>
                    </div>
                    <div class="progress-container">
                        <div class="progress-fill" [style.width.%]="progressPercent"></div>
                    </div>
                    <div class="time-stamp">{{ currentStepIndex + 1 }} / {{ totalSteps }}</div>
                </div>

            </div>
        </div>

        <!-- Canvas Info Label -->
        <div class="canvas-info">
            <div class="info-title">Macro View - Observable</div>
            <div class="info-controls">Rotate: Drag | Zoom: Scroll</div>
        </div>
    </div>
