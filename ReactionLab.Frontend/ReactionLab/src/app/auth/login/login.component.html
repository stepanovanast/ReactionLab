<div class="container">
    <div class="auth-card">
        <h1>Welcome back!</h1>
        <p class="subtitle">Ready to learn? Sign in to access your chemistry lab.</p>

        <!-- Error message -->
        <div *ngIf="errorMessage" class="error-message">
            {{ errorMessage }}
        </div>

        <form class="auth-form" (ngSubmit)="onSignIn()">
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email..."
                    [(ngModel)]="email"
                    name="email"
                    [disabled]="isLoading">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password..."
                    [(ngModel)]="password"
                    name="password"
                    [disabled]="isLoading">
            </div>

            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox" id="remember" [(ngModel)]="rememberMe" name="remember">
                    <span>Remember me</span>
                </label>
                <a routerLink="/forgot" class="forgot-link">Forgot password?</a>
            </div>

            <button
                type="submit"
                class="submit-btn"
                [disabled]="isLoading">
                {{ isLoading ? 'Signing in...' : 'Sign in' }}
            </button>

            <div class="toggle-text">
                <span>Don't have an account? </span>
                <a routerLink="/signup" class="toggle-link">Sign up!</a>
            </div>

            <div class="back-link">
                <a routerLink="/">← Back to home</a>
            </div>
        </form>
    </div>

    <p class="terms-text">
        By continuing, you agree to our Terms of Use and Privacy Policy
    </p>
</div>
